<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LookUp — выберите систему</title>
<meta name="description" content="LookUp: угол экрана и контроль осанки для Mac и Windows.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%230a0a0b%22/%3E%3Cpath d=%22M12 17V7M7.5 11.5 12 7l4.5 4.5%22 fill=%22none%22 stroke=%22white%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

<main class="choose">
  <div class="heroFig" id="heroFig"></div>
  <h1>LookUp</h1>
  <p class="lead">Подними экран — подними голову</p>

  <div class="pick">
    <a class="card glass pickCard" id="pickMac" href="mac/">
      <svg viewBox="0 0 120 80" class="pickIcon" aria-hidden="true">
        <rect x="24" y="8" width="72" height="46" rx="6" fill="none" stroke="currentColor" stroke-width="5"/>
        <path d="M8 62h104l-8 10H16z" fill="currentColor" opacity=".85"/>
      </svg>
      <b>Mac</b>
      <span class="chip">MacBook</span>
    </a>
    <a class="card glass pickCard" id="pickWin" href="windows/">
      <svg viewBox="0 0 120 80" class="pickIcon" aria-hidden="true">
        <rect x="6" y="6" width="68" height="44" rx="5" fill="none" stroke="currentColor" stroke-width="5"/>
        <path d="M0 58h80l-6 8H6z" fill="currentColor" opacity=".85"/>
        <rect x="82" y="22" width="34" height="46" rx="4" fill="none" stroke="currentColor" stroke-width="5"/>
      </svg>
      <b>Windows</b>
      <span class="chip">Ноутбук · Монитор</span>
    </a>
  </div>
</main>

<p class="note" style="text-align:center;margin-top:22px"><a href="measure/">Замер точности</a> · <a href="sources/">Источники</a></p>
<footer>LookUp — не медицинское устройство. Камера работает локально, видео не отправляется.<br>FIZTEX Hackathon</footer>

<script type="module">
  import { figure } from "./figure.js";
  document.getElementById("heroFig").innerHTML = figure(8);
  const p = (navigator.userAgentData?.platform || navigator.platform || "").toLowerCase();
  const mine = p.includes("mac") ? "pickMac" : p.includes("win") ? "pickWin" : null;
  if (mine) {
    const el = document.getElementById(mine);
    el.classList.add("mine");
    el.insertAdjacentHTML("beforeend", '<span class="chip ok">Ваша система</span>');
  }
</script>
</body>
</html>
